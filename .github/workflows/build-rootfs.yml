name: Build HiKey970 Rootfs

on:
  push:
    paths:
      - 'hikey-970'           # submodule pointer changed
      - 'rootfs/**'            # rootfs config changed
      - 'hikey970_dual_boot_builder.sh'
      - '.github/workflows/build-rootfs.yml'
  workflow_dispatch:           # manual trigger

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # GitHub aarch64 runner (public beta)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            android-sdk-libsparse-utils \
            dosfstools \
            gdisk \
            parted \
            mount \
            qemu-user-static \
            binfmt-support

      - name: Build kernel from submodule
        run: |
          cd hikey-970
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Copy HiKey970 defconfig
          cp ../config/hikey970_defconfig arch/arm64/configs/ 2>/dev/null || true
          make defconfig hikey970_defconfig 2>/dev/null || make defconfig
          make -j$(nproc) Image.gz dtbs modules
          # Copy outputs to rootfs boot dir
          mkdir -p ../rootfs/boot
          cp arch/arm64/boot/Image.gz ../rootfs/boot/
          cp arch/arm64/boot/dts/hisilicon/hi3670-hikey970.dtb ../rootfs/boot/

      - name: Build rootfs image
        run: |
          sudo bash hikey970_dual_boot_builder.sh \
            --skip-stage1 \
            --kernel-dir rootfs/boot
        env:
          DISTRO: bookworm
          SYSTEM_SIZE: 2048

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikey970-rootfs-${{ github.sha }}
          path: build/debian_bookworm.hikey970.*.sparse.img*
          retention-days: 7
