name: Build HiKey970 Rootfs

on:
  push:
    paths:
      - 'hikey-970'
      - 'rootfs/**'
      - 'hikey970_dual_boot_builder.sh'
      - '.github/workflows/build-rootfs.yml'
    tags:
      - 'v*'        # push v* tag 时触发构建并发布 Release
  workflow_dispatch:
  repository_dispatch:
    types: [gitlab-push]
  schedule:
    - cron: '0 6 * * *'  # 每天 UTC 06:00 自动检查

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write    # 允许 gh release create
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            android-sdk-libsparse-utils \
            dosfstools \
            gdisk \
            parted \
            mount \
            qemu-user-static \
            binfmt-support \
            flex bison bc rsync \
            device-tree-compiler

      - name: Build kernel from submodule
        run: |
          cd hikey-970
          echo "=== KERNEL COMMITS ==="
          git log --oneline -10
          echo "=== CONFIG ==="
          make hikey970_defconfig
          grep -c "=y\|=m" .config
          make -j$(nproc) Image.gz dtbs DTC=/usr/bin/dtc
          echo "=== DTB OUTPUT ==="
          ls -la arch/arm64/boot/dts/hisilicon/hi3670-hikey970.dtb
          md5sum arch/arm64/boot/dts/hisilicon/hi3670-hikey970.dtb
          mkdir -p ../rootfs/boot
          cp arch/arm64/boot/Image.gz ../rootfs/boot/
          cp arch/arm64/boot/dts/hisilicon/hi3670-hikey970.dtb ../rootfs/boot/

      - name: Upload kernel Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: rootfs/boot/Image.gz
          retention-days: 7

      - name: Upload DTB
        uses: actions/upload-artifact@v4
        with:
          name: hi3670-hikey970.dtb
          path: rootfs/boot/hi3670-hikey970.dtb
          retention-days: 7

      - name: Build rootfs
        run: |
          sudo -E bash hikey970_dual_boot_builder.sh
        env:
          DISTRO: bookworm
          SYSTEM_SIZE: 6144
          SD_IMAGE_SIZE: 256000
          BOOT_SIZE: 1024
          # tag 构建时用 tag 名作镜像版本号（文件名中的 vX.Y）
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0' }}

      - name: Upload debootstrap log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debootstrap.log
          path: /home/runner/work/hikey970-debian-image/hikey970-debian-image/build/rootfs/debootstrap/debootstrap.log
          retention-days: 7

      - name: Upload eMMC image
        uses: actions/upload-artifact@v4
        with:
          name: emmc-sparse-img
          path: build/*.sparse.img*
          retention-days: 7

      - name: Upload SD card image
        uses: actions/upload-artifact@v4
        with:
          name: sdcard-img
          path: build/*.img.gz
          retention-days: 7

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/*.sparse.img.tar.gz \
            build/*.img.gz \
            rootfs/boot/Image.gz \
            rootfs/boot/hi3670-hikey970.dtb \
            --title "HiKey970 Debian ${GITHUB_REF_NAME}" \
            --generate-notes
