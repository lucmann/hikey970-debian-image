name: Build HiKey970 Rootfs

on:
  push:
    paths:
      - 'hikey-970'
      - 'rootfs/**'
      - 'hikey970_dual_boot_builder.sh'
      - '.github/workflows/build-rootfs.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [gitlab-push]
  schedule:
    - cron: '0 6 * * *'  # 每天 UTC 06:00 自动检查

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            android-sdk-libsparse-utils \
            dosfstools \
            gdisk \
            parted \
            mount \
            qemu-user-static \
            binfmt-support \
            flex bison bc rsync

      - name: Build kernel from submodule
        run: |
          cd hikey-970
          echo "=== KERNEL COMMITS ==="
          git log --oneline -10
          echo "=== CONFIG ==="
          grep -c "=y\|=m" ../config/hikey970_verifiedconfig
          make -j$(nproc) KCONFIG_CONFIG=../config/hikey970_verifiedconfig
          mkdir -p ../rootfs/boot
          cp arch/arm64/boot/Image.gz ../rootfs/boot/
          cp arch/arm64/boot/dts/hisilicon/hi3670-hikey970.dtb ../rootfs/boot/

      - name: Upload kernel Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: rootfs/boot/Image.gz
          retention-days: 7

      - name: Upload DTB
        uses: actions/upload-artifact@v4
        with:
          name: hi3670-hikey970.dtb
          path: rootfs/boot/hi3670-hikey970.dtb
          retention-days: 7

      - name: Build rootfs
        run: |
          sudo bash hikey970_dual_boot_builder.sh
        env:
          DISTRO: bookworm
          SYSTEM_SIZE: 2048

      - name: Upload eMMC image
        uses: actions/upload-artifact@v4
        with:
          name: emmc-sparse-img
          path: build/*.sparse.img*
          retention-days: 7

      - name: Upload SD card image
        uses: actions/upload-artifact@v4
        with:
          name: sdcard-img
          path: build/*.img.gz
          retention-days: 7
