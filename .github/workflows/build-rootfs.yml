name: Build HiKey970 Rootfs

on:
  push:
    paths:
      - 'hikey-970'
      - 'rootfs/**'
      - 'hikey970_dual_boot_builder.sh'
      - '.github/workflows/build-rootfs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            android-sdk-libsparse-utils \
            dosfstools \
            gdisk \
            parted \
            mount \
            qemu-user-static \
            binfmt-support \
            gcc-aarch64-linux-gnu \
            flex bison bc rsync

      - name: Build kernel from submodule
        run: |
          cd hikey-970
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig
          make -j$(nproc) Image.gz dtbs modules
          mkdir -p ../rootfs/boot
          cp arch/arm64/boot/Image.gz ../rootfs/boot/
          cp arch/arm64/boot/dts/hisilicon/hi3670-hikey970.dtb ../rootfs/boot/

      - name: Build rootfs
        run: |
          sudo bash hikey970_dual_boot_builder.sh
        env:
          DISTRO: bookworm
          SYSTEM_SIZE: 2048

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikey970-rootfs-${{ github.sha }}
          path: build/*.sparse.img*
          retention-days: 7
