set default="4"
set timeout=2

menuentry 'Debian 12 Bookworm (v4.9) eMMC' {
    search.fs_label rootfs root
    set root=($root)
    linux /boot/Image-hikey970-v4.9.gz earlycon=pl011,0xfff32000,115200 clk_ignore_unused=true console=tty0 console=ttyAMA6,115200n8 root=/dev/sdd12 rootwait rw debug loglevel=8 efi=noruntime dw_mmc.debug=1
    devicetree /boot/kirin970-hikey970.dtb
}

menuentry 'Debian 12 Bookworm (v6.19) eMMC' {
    search.fs_label rootfs root
    set root=($root)
    linux /boot/Image-hikey970-v6.19.0-rc2.gz earlycon=pl011,0xfff32000,115200 clk_ignore_unused=true console=tty0 console=ttyAMA6,115200n8 root=/dev/sdd12 rootwait rw debug loglevel=8 efi=noruntime dw_mmc.debug=1
    devicetree /boot/hi3670-hikey970.dtb
}

menuentry 'Debian 12 Bookworm (v4.9) SD Card' {
    set root=(hd4,msdos1)
    linux /Image-hikey970-v4.9.gz drm.debug=0x0 earlycon=pl011,0xfff32000,115200 clk_ignore_unused=true console=tty0 console=ttyAMA6,115200n8 root=/dev/mmcblk0p2 rootwait rw debug loglevel=8 efi=noruntime dw_mmc.debug=1
    devicetree /kirin970-hikey970.dtb
}

menuentry 'Debian 12 Bookworm (v4.9 2026) SD Card' {
    set root=(hd4,msdos1)
    linux /Image.2026.gz drm.debug=0x3f earlycon=pl011,0xfff32000,115200 clk_ignore_unused=true console=tty0 console=ttyAMA6,115200n8 root=/dev/mmcblk0p2 rootwait rw debug loglevel=8 efi=noruntime dw_mmc.debug=1
    devicetree /kirin970-hikey970.2026.dtb
}

menuentry 'Debian 12 Bookworm (v7.2) SD Card' {
    set root=(hd4,msdos1)
    linux /Image.gz log_buf_len=8M dyndbg="file drivers/staging/hikey9xx/* +p" drm.debug=0x0 earlycon=pl011,0xfff32000,115200 clk_ignore_unused=true console=tty0 console=ttyAMA6,115200n8 root=/dev/mmcblk1p2 rootwait rw debug loglevel=8 efi=noruntime
    devicetree /hi3670-hikey970.dtb
}

menuentry 'Recovery mode (Hikey 970 CE)' {
    search.fs_label rootfs root
    set root=($root)
    linux /boot/Image-hikey970-v4.9.gz earlycon=pl011,0xfff32000,115200 clk_ignore_unused=true console=tty0 console=ttyAMA6,115200n8 ro quiet efi=noruntime init=/bin/sh
    devicetree /boot/kirin970-hikey970.dtb
    initrd /boot/initramfs-v4.9
}

menuentry 'Fastboot' {
    search.fs_label boot boot_part
    chainloader ($boot_part)/EFI/BOOT/fastboot.efi
}
