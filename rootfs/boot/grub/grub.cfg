set default="0"
set timeout=10

menuentry 'Ubuntu Server Bionic 18.04 (Hikey 970 CE)' {
    search.fs_label rootfs root
    set root=($root)
    #linux /boot/Image-hikey970-v4.9.gz earlycon=pl011,0xfff32000,115200 clk_ignore_unused=true console=tty0 console=ttyAMA6,115200n8 root=/dev/sdd12 rootwait rw debug loglevel=7 initcall_debug efi=noruntime
    #devicetree /boot/kirin970-hikey970.dtb
    linux /boot/Image-hikey970-v6.19.0-rc2.gz earlycon=pl011,0xfff32000,115200 clk_ignore_unused=true console=tty0 console=ttyAMA6,115200n8 root=/dev/sdd12 rootwait rw debug loglevel=7 initcall_debug efi=noruntime random.trust_cpu=on random.hwrng=1
    devicetree /boot/hi3670-hikey970.dtb
}

menuentry 'Recovery mode (Hikey 970 CE)' {
    search.fs_label rootfs root
    set root=($root)
    linux /boot/Image-hikey970-v4.9.gz earlycon=pl011,0xfff32000,115200 clk_ignore_unused=true console=tty0 console=ttyAMA6,115200n8 ro quiet efi=noruntime init=/bin/sh
    devicetree /boot/kirin970-hikey970.dtb
    initrd /boot/initramfs-v4.9
}

menuentry 'Fastboot' {
    search.fs_label boot boot_part
    chainloader ($boot_part)/EFI/BOOT/fastboot.efi
}
